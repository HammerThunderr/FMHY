name: Ad Scan

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Hosts to scan this run"
        default: "250"
      concurrency:
        description: "Parallel pages"
        default: "4"
      page:
        description: "Optional FMHY page filter (e.g. Streaming)"
        default: ""
      starred_only:
        description: "Only community-starred links"
        type: boolean
        default: false
  schedule:
    - cron: "40 1,7,13,19 * * *"

permissions:
  contents: write

concurrency:
  group: ad-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Generous cap; the scanner's own --budget stops work long before this,
    # so the commit step is never the thing that gets cancelled.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Scan batch
        env:
          LIMIT: ${{ inputs.limit || '250' }}
          CONC: ${{ inputs.concurrency || '4' }}
          PAGE: ${{ inputs.page }}
          STARRED: ${{ inputs.starred_only }}
        run: |
          # Stop scanning at 40 min. With a 60-min job cap that leaves 20 min
          # of headroom for install + commit, so a slow batch can never eat
          # into the commit step.
          ARGS="--limit $LIMIT --concurrency $CONC --timeout 30 --budget 2400"
          [ -n "$PAGE" ] && ARGS="$ARGS --page $PAGE"
          [ "$STARRED" = "true" ] && ARGS="$ARGS --starred-only"
          python ad_scan.py $ARGS | tee scan.log

      # Commit runs even if the scan step failed or was cancelled, so partial
      # progress is always saved rather than lost with the runner.
      - name: Commit results
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ad-ratings.json data/ad-ratings.csv data/ad-scan-state.json
          if git diff --staged --quiet; then
            echo "No change to commit."
          else
            git commit -m "data: ad ratings $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## FMHY ad scan"
            echo ""
            echo '```'
            tail -c 30000 scan.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
